

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "40257:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_portfolio
      - GITHUB_APP_ID=1924157
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github_app_private_key
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - OAUTH_GITHUB_CLIENT_ID=Iv23liYNGNeBYvjggHMm
      - OAUTH_GITHUB_CLIENT_SECRET=7eab6782cd45d67147fd870ea0f677350a80e36a 
      - CONTRIBUTOR_WINDOW_DAYS=90
      - ALLOWED_ORGS=*
      - ADMIN_BASIC_AUTH_USER=admin
      - ADMIN_BASIC_AUTH_PASS=admin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    secrets:
      - github_app_private_key

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "45523:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:40257
      - VITE_GITHUB_APP_INSTALL_URL=https://github.com/apps/ai-portfolio-console/installations/new
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  postgres_data:

secrets:
  github_app_private_key:
    file: ./secrets/github_app_private_key.pem.example